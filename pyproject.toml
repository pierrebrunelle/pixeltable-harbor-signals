[project]
name = "pixeltable-harbor-signals"
version = "0.1.0"
description = "Harbor radio signal media pipeline: audio normalize/fade, vision box overlays, and StringSplitter sentence views - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "harbor-signals"]
dependencies = [
    "pixeltable>=0.7.16",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
